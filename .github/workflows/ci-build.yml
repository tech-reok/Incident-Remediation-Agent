name: Node API CI Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.js'
      - 'package*.json'
      - 'Dockerfile'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: [self-hosted, Linux, X64, tech-reok-builders]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          path: src

      # 1. Seteamos la versión (inyectando el hash en el package.json)
      - name: Setup commit on version info
        shell: bash
        working-directory: src
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "Setting commit hash in package.json: ${COMMIT_HASH}"
          # Utilizamos 'jq' para agregar/actualizar el hash del commit en package.json
          if [ -f package.json ]; then
            jq --arg hash "$COMMIT_HASH" '.commitHash = $hash' package.json > tmp.$$.json && mv tmp.$$.json package.json
            echo "Updated package.json with commit hash."
          else
            echo "package.json not found, skipping commit hash update."
          fi

      # 2. Realizamos el Docker tag
      - name: Generate Docker tag
        id: meta
        shell: bash
        working-directory: src
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          DOCKER_TAG="marcocantugea/${REPO_NAME}:${SHORT_SHA}"

          echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"

      # 3. Realizamos el build de la imagen
      - name: Build Docker image
        shell: bash
        working-directory: src
        run: |
          docker build \
            -f Dockerfile \
            -t "${{ steps.meta.outputs.docker_tag }}" \
            .

      # 4. Realizamos el login a Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Realizamos el push a Docker Hub
      - name: Push Docker image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          docker push "${{ steps.meta.outputs.docker_tag }}"

      # 6. Extraemos el artefacto (código + node_modules listos para prod)
      - name: Extract publish artifacts from image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        working-directory: src
        run: |
          echo "Creating temporary container from image: ${{ steps.meta.outputs.docker_tag }}"
          CONTAINER=$(docker create "${{ steps.meta.outputs.docker_tag }}")
          echo "Copying /usr/src/app from container $CONTAINER to ./publish"
          docker cp "$CONTAINER":/usr/src/app ./publish || true
          docker rm "$CONTAINER" || true

      # 7. Subimos el artefacto a GitHub
      - name: Upload publish artifact
        id: upload_publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ steps.meta.outputs.short_sha }}
          path: src/publish/
          if-no-files-found: error

      # 8. Realizamos el summary
      - name: Job summary
        shell: bash
        working-directory: src
        run: |
          {
            echo "## CI Build/Test Summary"
            echo ""
            echo "- Docker tag: ${{ steps.meta.outputs.docker_tag }}"
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "- Docker image pushed: yes"
            else
              echo "- Docker image pushed: no (event: ${{ github.event_name }})"
            fi
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "- Publish artifact id: ${{ steps.upload_publish.outputs.artifact-id }}"
            else
              echo "- Publish artifact id: not-uploaded (event: ${{ github.event_name }})"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"