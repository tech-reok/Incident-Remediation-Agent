name: Node API CI Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/api/**'
      - 'dockerfile'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: [self-hosted, Linux, X64, tech-reok-builders]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          # Eliminamos 'path: src' para trabajar directamente sobre la estructura real del repo

      - name: Setup commit on version info
        shell: bash
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "Setting commit hash in package.json: ${COMMIT_HASH}"
          
          # Actualizamos el package.json dentro de la ruta correcta
          if [ -f src/api/package.json ]; then
            jq --arg hash "$COMMIT_HASH" '.commitHash = $hash' src/api/package.json > tmp.$$.json && mv tmp.$$.json src/api/package.json
            echo "Updated package.json with commit hash."
          else
            echo "src/api/package.json not found, skipping commit hash update."
          fi

      - name: Generate Docker tag
        id: meta
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          DOCKER_TAG="marcocantugea/${REPO_NAME}:${SHORT_SHA}"

          echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        shell: bash
        run: |
          # Se ejecuta desde la raíz, usando el dockerfile que está ahí
          docker build \
            -f dockerfile \
            -t "${{ steps.meta.outputs.docker_tag }}" \
            .

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          docker push "${{ steps.meta.outputs.docker_tag }}"

      - name: Extract publish artifacts from image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "Creating temporary container from image: ${{ steps.meta.outputs.docker_tag }}"
          CONTAINER=$(docker create "${{ steps.meta.outputs.docker_tag }}")
          
          # Extraemos el código ya empaquetado para producción
          echo "Copying /usr/src/app from container $CONTAINER to ./publish"
          docker cp "$CONTAINER":/usr/src/app ./publish || true
          docker rm "$CONTAINER" || true

      - name: Upload publish artifact
        id: upload_publish
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ steps.meta.outputs.short_sha }}
          path: publish/
          if-no-files-found: error

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## CI Build/Test Summary"
            echo ""
            echo "- Docker tag: ${{ steps.meta.outputs.docker_tag }}"
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "- Docker image pushed: yes"
            else
              echo "- Docker image pushed: no (event: ${{ github.event_name }})"
            fi
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "- Publish artifact id: ${{ steps.upload_publish.outputs.artifact-id }}"
            else
              echo "- Publish artifact id: not-uploaded (event: ${{ github.event_name }})"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"